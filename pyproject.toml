[project]
name = "repobridge"
version = "1.0.0"
description = "MCP server for navigating and working across multiple Git repositories"
requires-python = ">=3.11"
readme = "README.md"
license = {text = "MIT"}
keywords = ["mcp", "ai", "git", "repositories", "claude", "copilot", "cursor"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Version Control :: Git",
]
dependencies = [
    "mcp[cli]>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[project.urls]
Homepage = "https://github.com/sundeepsuddala/repobridge"
Repository = "https://github.com/sundeepsuddala/repobridge"
Issues = "https://github.com/sundeepsuddala/repobridge/issues"

[project.scripts]
repobridge = "server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
only-include = ["server.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
